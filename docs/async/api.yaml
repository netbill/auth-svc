asyncapi: 2.6.0
info:
  title: netbill auth-svc Async API
  version: 0.1.0
  description: WebSocket API documentation for auth-svc.

servers:
  local:
    url: localhost:8001
    protocol: ws
    description: Local development server

channels:
  /auth-svc/v1/login/qr:
    description: >
      WebSocket channel for QR login flow.
      Connect without authentication — the server immediately sends a QR token.
      The desktop renders it as a QR code. When the mobile client confirms via
      POST /auth-svc/v1/login/qr/confirm, the server pushes session tokens and closes
      the connection. Expires after 2 minutes if not confirmed.
    bindings:
      ws:
        method: GET
    subscribe:
      description: Messages sent by the server to the client.
      message:
        oneOf:
          - $ref: './spec/messages/QRToken.yaml'
          - $ref: './spec/messages/QRConfirmed.yaml'
          - $ref: './spec/messages/QRExpired.yaml'
