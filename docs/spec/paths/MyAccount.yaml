get:
  tags:
    - accounts
  summary: Get my account
  description: >
    Returns the authenticated account.

  parameters:
    - in: query
      name: include
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - email
      style: form
      explode: false
      description: >
        Optional related resources to include. Supported values: `email`.

  security:
    - BearerAuth: [ ]
  responses:
    '200':
      description: Account successfully retrieved
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Account.yaml'

    '401':
      description: >
        Unauthorized. Invalid credentials or account cannot be resolved from context.
        Check the `detail` field in the response for more information.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

delete:
  tags:
    - accounts
  summary: Delete my account
  description: >
    Deletes the authenticated account.

  security:
    - BearerAuth: [ ]
  responses:
    '204':
      description: Account successfully deleted

    '401':
      description: >
        Unauthorized. Invalid credentials, initiator account not found, or session is invalid.
        Check the `detail` field in the response for more information.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '403':
      description: >
        Account is have membership in an organization, 
        must leave all organizations before deleting the account.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
