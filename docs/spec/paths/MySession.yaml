parameters:
  - in: path
    name: session_id
    required: true
    schema:
      type: string
      format: uuid
    description: Session ID

get:
  tags:
    - sessions
  summary: Get my sessions
  description: >
    Returns sessions of the authenticated account.
  security:
    - BearerAuth: [ ]
  responses:
    '200':
      description: Sessions successfully retrieved
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/AccountSessionsCollection.yaml'

    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

delete:
  tags:
    - sessions
  summary: Delete my sessions
  description: >
    Delete session by ID
  security:
    - BearerAuth: [ ]
  responses:
    '204':
      description: Session successfully deleted

    '401':
      description: Unauthorized, session not exist or session does not belong to the authenticated account
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
