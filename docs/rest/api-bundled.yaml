openapi: 3.1.1
info:
  title: netbill auth-svc API
  description: API documentation for auth-svc
  version: 0.1.0
servers:
  - url: 'http://localhost:8001'
paths:
  /auth-svc/v1/registration/:
    post:
      tags:
        - registration
      summary: Register a new user
      description: Endpoint to register a new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: User successfully registered
        '409':
          description: |
            Conflict: A user with this email or username already exists. Check the 'detail' field in the response for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/registration/admin:
    post:
      tags:
        - registration
      summary: Register a new admin user
      description: |
        Registers a new user by an authenticated admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationAdmin'
      responses:
        '201':
          description: User successfully registered by admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            Bad Request. Request body is invalid or some attributes do not meet requirements. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. User cannot be resolved from context. Check the `detail` field in the response for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '409':
          description: |
            Conflict. Email or username is already taken. Check the `detail` field in the response for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/email:
    post:
      tags:
        - login
      summary: Login by email
      description: |
        Endpoint to login a user using their email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginByEmail'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensPair'
        '401':
          description: |
            Unauthorized: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/google:
    post:
      tags:
        - login
      summary: Start Google OAuth login
      description: |
        Redirects the user-agent to Google OAuth consent screen. This endpoint returns a redirect and does not return a JSON:API document.
      responses:
        '307':
          description: Temporary Redirect to Google OAuth consent screen
          headers:
            Location:
              description: Google OAuth authorization URL
              schema:
                type: string
                format: uri
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/google/callback:
    get:
      tags:
        - login
      summary: Google OAuth callback
      description: |
        Exchanges Google OAuth `code` for user info and returns an access/refresh tokens pair.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: OAuth authorization code returned by Google
      responses:
        '200':
          description: Tokens pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensPair'
        '400':
          description: Missing or invalid query parameter `code`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: User not found or deleted for this email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/refresh:
    post:
      tags:
        - sessions
      summary: Refresh session
      description: |
        Issues a new access/refresh tokens pair using a valid refresh token.
        **401 Unauthorized** is returned when the user or session does not exist. **403 Forbidden** is returned when the user is inactive or the refresh token does not match the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSession'
      responses:
        '200':
          description: Tokens pair successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensPair'
        '400':
          description: |
            Bad Request. Request body is invalid. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. User not found or session not found or invalid refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me:
    get:
      tags:
        - users
      summary: Get my user
      description: |
        Returns the authenticated user.
      parameters:
        - in: query
          name: include
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - email
          style: form
          explode: false
          description: |
            Optional related resources to include. Supported values: `email`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: |
            Unauthorized. The user is deleted and can no longer be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    patch:
      tags:
        - users
      summary: Update my user
      description: |
        Updates the fields (pseudonym, description, avatar) of the authenticated user. The request body must contain the same `data.id` as the authenticated user id.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request (validation error / invalid avatar key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - users
      summary: Delete my user
      description: |
        Deletes the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User successfully deleted
        '401':
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/logout:
    post:
      tags:
        - sessions
      summary: Logout
      description: |
        Invalidates the current session of the authenticated user. This operation is idempotent — if the session is already deleted, 204 is returned.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Successfully logged out (or session was already deleted)
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/password:
    patch:
      tags:
        - users
      summary: Update password
      description: |
        Updates the password of the authenticated user.
        **401 Unauthorized** is returned when the session is invalid or the old password is incorrect.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePassword'
      responses:
        '204':
          description: Password successfully updated
        '400':
          description: |
            Bad Request. Request body is invalid or the new password does not meet requirements. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. The session is invalid, does not belong to the authenticated user, or the old password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/username:
    patch:
      tags:
        - users
      summary: Update my username
      description: |
        Updates the authenticated user's username. The request body must contain the same `data.id` as the authenticated user id.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsername'
      responses:
        '200':
          description: Username successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request (validation error / invalid username).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '409':
          description: Conflict (username already taken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/media:
    post:
      tags:
        - users
      summary: Create user avatar upload media link
      description: |
        Creates upload media links for the authenticated user's avatar.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Upload media links successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUserMediaLinks'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token, or the authenticated user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - users
      summary: Delete uploaded user media
      description: |
        Deletes a previously uploaded (not yet attached) media for the user's avatar.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUploadUserAvatar'
      responses:
        '200':
          description: Media successfully deleted.
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token, or the authenticated user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/sessions:
    get:
      tags:
        - sessions
      summary: Get my sessions
      description: |
        Returns sessions of the authenticated user.
        Supports pagination, filtering by deletion status, and sorting by last used date.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: 'page[limit]'
          required: false
          schema:
            type: integer
            minimum: 1
          description: Max number of items to return
        - in: query
          name: 'page[offset]'
          required: false
          schema:
            type: integer
            minimum: 0
          description: Number of items to skip
        - in: query
          name: 'filter[active]'
          required: false
          schema:
            type: boolean
          description: |
            Filter sessions by active status. - `true` — only active (non-deleted) sessions - `false` — only deleted sessions - omit — all sessions (default)
        - in: query
          name: 'sort[last_used]'
          required: false
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
          description: |
            Sort sessions by last used date. - `desc` — most recently used first (default) - `asc` — least recently used first
      responses:
        '200':
          description: Sessions successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionsCollection'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - sessions
      summary: Delete my sessions
      description: |
        Deletes all sessions of the authenticated user (logout from all devices).
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Sessions successfully deleted
        '401':
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/auth-svc/v1/me/sessions/{session_id}':
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
          format: uuid
        description: Session ID
    get:
      tags:
        - sessions
      summary: Get my session
      description: |
        Returns a single session of the authenticated user by ID.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - sessions
      summary: Delete my session
      description: |
        Deletes a session by ID. The session must belong to the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Session successfully deleted
        '401':
          description: |
            Unauthorized. The session does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/qr:
    get:
      tags:
        - qr
      summary: Connect to QR login session
      description: |
        Opens a Server-Sent Events (text/event-stream) connection. Upon connecting, the server generates a QR token and sends it as the first event. The client renders it as a QR code. When the mobile client confirms the token via POST /auth-svc/v1/login/qr/confirm, the server pushes the session tokens through this same stream and closes it. The stream closes with an `error` event if the token isn't confirmed within 5 minutes.

        Events sent as SSE `event:`/`data:` frames, each shaped like a normal JSON:API response body for this API:
          - `qr_token` — body shaped like the `QRToken` schema. Sent once, immediately
            after connecting.
          - `tokens` — body shaped like the `TokensPair` schema, same as every other
            login endpoint. Sent once the QR token is confirmed; the stream closes
            right after.
          - `error` — body shaped like the `Errors` schema. Sent if the token isn't
            confirmed in time; the stream closes right after.
      responses:
        '200':
          description: |
            Event stream established. See the description above for the events sent over it.
          content:
            text/event-stream:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/qr/confirm:
    post:
      tags:
        - qr
      summary: Confirm QR token
      description: |
        Confirms a pending QR token. The mobile client (already authenticated) scans the QR code and calls this endpoint. The server creates a new session and pushes the tokens to the desktop's SSE stream opened via GET /auth-svc/v1/login/qr.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRConfirm'
      responses:
        '204':
          description: QR token confirmed. Tokens are delivered to the desktop via the SSE stream.
        '400':
          description: |
            Bad Request. Request body is invalid or qr_token format is wrong. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Bearer token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            QR token not found or expired (TTL 5 minutes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '409':
          description: |
            QR token already confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/users/:
    get:
      tags:
        - users
      summary: Filter users
      description: |
        Returns a paginated list of public users filtered by optional query parameters. Supports prefix-based filtering for `username` and `pseudonym`.
      parameters:
        - in: query
          name: text
          required: false
          schema:
            type: string
          description: |
            Text to filter users by. Matches against `username` and `pseudonym` fields.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number (1-based).
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Max number of items per page (1-100).
      responses:
        '200':
          description: Users list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersCollection'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/auth-svc/v1/users/@{username}':
    get:
      tags:
        - users
      summary: Get user by username
      description: |
        Returns a public user by `username`. If the user does not exist, responds with 404.
      parameters:
        - name: username
          in: path
          required: true
          description: Username of the user.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/auth-svc/v1/users/{user_id}':
    get:
      tags:
        - users
      summary: Get user by id
      description: |
        Returns a public user by `user_id` (UUID). If the user does not exist, responds with 404.
      parameters:
        - name: user_id
          in: path
          required: true
          description: User id (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request (invalid user_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: User does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginByEmail:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - user_session
            attributes:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: The user's email address.
                  example: example@gmail.com
                password:
                  type: string
                  format: password
                  description: The user's password.
                  example: StrongP@ssw0rd!
    Registration:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - user
            attributes:
              type: object
              required:
                - email
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                  description: The user's email address.
                  example: example@gmail.com
                password:
                  type: string
                  format: password
                  description: The user's password.
                  example: StrongP@ssw0rd!
                username:
                  type: string
                  description: |
                    Unique username. 3-32 characters, letters and digits only.
                  example: johndoe123
    RegistrationAdmin:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - user
            attributes:
              type: object
              required:
                - email
                - password
                - username
                - role
              properties:
                email:
                  type: string
                  format: email
                  description: The user's email address.
                  example: example1312@gmail.com
                password:
                  type: string
                  format: password
                  description: The user's password.
                  example: StrongP@ssw0rd!
                username:
                  type: string
                  description: |
                    Unique username. 3-32 characters, letters and digits only.
                  example: johndoe123
                role:
                  type: string
                  description: The role assigned to the registering user.
                  enum:
                    - admin
                    - moderator
                  example: admin
    RefreshSession:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - user_session
            attributes:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: The refresh token to generate a new access token.
