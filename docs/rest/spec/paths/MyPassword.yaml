patch:
  tags:
    - accounts
  summary: Update password
  description: >
    Updates the password of the authenticated account.

    **401 Unauthorized** is returned when the session is invalid or the old password is incorrect.
  security:
    - BearerAuth: [ ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/requests/UpdatePassword.yaml'
  responses:
    '204':
      description: Password successfully updated

    '400':
      description: >
        Bad Request. Request body is invalid or the new password does not meet requirements.
        Check the `errors` array for details.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '401':
      description: >
        Unauthorized. The session is invalid, does not belong to the authenticated account,
        or the old password is incorrect.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
