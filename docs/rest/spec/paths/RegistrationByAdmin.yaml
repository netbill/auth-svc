post:
  tags:
    - registration
  summary: Register a new admin account
  description: >
    Registers a new account by an authenticated admin.

  security:
    - BearerAuth: [ ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/requests/RegistrationAdmin.yaml'
  responses:
    '201':
      description: Account successfully registered by admin
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Account.yaml'

    '400':
      description: >
        Bad Request. Request body is invalid or some attributes do not meet requirements.
        Check the `errors` array for details.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '401':
      description: >
        Unauthorized. Account cannot be resolved from context.
        Check the `detail` field in the response for more information.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '409':
      description: >
        Conflict. Email or username is already taken.
        Check the `detail` field in the response for more information.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
