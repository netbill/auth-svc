post:
  tags:
    - registration
  summary: Register a new user
  description: Endpoint to register a new user.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/requests/Registration.yaml'
  responses:
    '201':
      description: User successfully registered

    '409':
      description: >
        Conflict: An user with this email or phone number already exists.
        Check the 'detail' field in the response for more information.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'