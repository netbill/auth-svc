patch:
  tags:
    - accounts
  summary: Update username
  description: >
    Updates the username of the authenticated account.

    **401 Unauthorized** is returned when the account is deleted.
    **404 Not Found** is returned when the account does not exist.
    **409 Conflict** is returned when the requested username is already taken.
  security:
    - BearerAuth: [ ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/requests/UpdateUsername.yaml'
  responses:
    '200':
      description: Username successfully updated
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Account.yaml'

    '400':
      description: >
        Bad Request. Request body is invalid.
        Check the `errors` array for details.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '401':
      description: >
        Unauthorized. The account is deleted and can no longer be used.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '404':
      description: >
        Account not found.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '409':
      description: >
        Conflict. The requested username is already taken.
        Check the `detail` field in the response for more information.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
