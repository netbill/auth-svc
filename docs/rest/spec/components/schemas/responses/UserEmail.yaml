type: object
required:
  - id
  - type
  - attributes
properties:
  id:
    type: string
    format: uuid
    description: "user ID"
  type:
    type: string
    enum: [ user_email ]
  attributes:
    type: object
    required:
      - email
      - version
      - verified
      - updated_at
      - created_at
    properties:
      email:
        type: string
        format: email
        description: "The email address associated with the user"
      version:
        type: integer
        description: "The version number of the user record"
      verified:
        type: boolean
        description: "Indicates whether the email address has been verified"
      updated_at:
        type: string
        format: date-time
        description: "The date and time when the email information was last updated"
      created_at:
        type: string
        format: date-time
        description: "The date and time when the email information was created"