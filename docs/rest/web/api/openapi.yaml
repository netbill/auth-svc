openapi: 3.1.1
info:
  description: API documentation for auth-svc
  title: netbill auth-svc API
  version: 0.1.0
servers:
- url: http://localhost:8001
paths:
  /auth-svc/v1/registration/:
    post:
      description: Endpoint to register a new user.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
        required: true
      responses:
        "201":
          description: User successfully registered
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Conflict: An user with this email or phone number already exists. Check the 'detail' field in the response for more information.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal server error
      summary: Register a new user
      tags:
      - registration
  /auth-svc/v1/registration/admin:
    post:
      description: |
        Registers a new user by an authenticated admin.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationAdmin"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User successfully registered by admin
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Request body is invalid or some attributes do not meet requirements. Check the `errors` array for details.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. User cannot be resolved from context. Check the `detail` field in the response for more information.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Conflict. Email is already taken. Check the `detail` field in the response for more information.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Register a new admin user
      tags:
      - registration
  /auth-svc/v1/login/email:
    post:
      description: |
        Endpoint to login a user using their email and password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginByEmail"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensPair"
          description: Successful login
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized: Invalid email or password.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal server error
      summary: Login by email
      tags:
      - login
  /auth-svc/v1/login/google:
    post:
      description: |
        Redirects the user-agent to Google OAuth consent screen. This endpoint returns a redirect and does not return a JSON:API document.
      responses:
        "307":
          description: Temporary Redirect to Google OAuth consent screen
          headers:
            Location:
              description: Google OAuth authorization URL
              explode: false
              schema:
                format: uri
                type: string
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      summary: Start Google OAuth login
      tags:
      - login
  /auth-svc/v1/login/google/callback:
    get:
      description: |
        Exchanges Google OAuth `code` for user info and returns an access/refresh tokens pair.
      parameters:
      - description: OAuth authorization code returned by Google
        explode: true
        in: query
        name: code
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensPair"
          description: Tokens pair issued
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Missing or invalid query parameter `code`
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: User not found or deleted for this email
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      summary: Google OAuth callback
      tags:
      - login
  /auth-svc/v1/refresh:
    post:
      description: |
        Issues a new access/refresh tokens pair using a valid refresh token.
        **401 Unauthorized** is returned when the user or session does not exist. **403 Forbidden** is returned when the user is inactive or the refresh token does not match the session.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSession"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensPair"
          description: Tokens pair successfully refreshed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Request body is invalid. Check the `errors` array for details.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. User not found or session not found or invalid refresh token.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      summary: Refresh session
      tags:
      - sessions
  /auth-svc/v1/me:
    delete:
      description: |
        Deletes the authenticated user.
      responses:
        "204":
          description: User successfully deleted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated user.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            User not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete my user
      tags:
      - users
    get:
      description: |
        Returns the authenticated user.
      parameters:
      - description: |
          Optional related resources to include. Supported values: `email`.
        explode: false
        in: query
        name: include
        required: false
        schema:
          items:
            enum:
            - email
            type: string
          type: array
          default: null
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User successfully retrieved
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. The user is deleted and can no longer be used.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            User not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get my user
      tags:
      - users
    patch:
      description: |
        Updates the fields (pseudonym, description, avatar) of the authenticated user. The request body must contain the same `data.id` as the authenticated user id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Bad request (validation error / invalid avatar key).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated user.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            User not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update my user
      tags:
      - users
  /auth-svc/v1/me/logout:
    post:
      description: |
        Invalidates the current session of the authenticated user. This operation is idempotent — if the session is already deleted, 204 is returned.
      responses:
        "204":
          description: Successfully logged out (or session was already deleted)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - sessions
  /auth-svc/v1/me/password:
    patch:
      description: |
        Updates the password of the authenticated user.
        **401 Unauthorized** is returned when the session is invalid or the old password is incorrect.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePassword"
        required: true
      responses:
        "204":
          description: Password successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Request body is invalid or the new password does not meet requirements. Check the `errors` array for details.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. The session is invalid, does not belong to the authenticated user, or the old password is incorrect.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update password
      tags:
      - users
  /auth-svc/v1/me/username:
    patch:
      description: |
        Updates the authenticated user's username. The request body must contain the same `data.id` as the authenticated user id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUsername"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Username successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Bad request (validation error / invalid username).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated user.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            User not found.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Conflict (username already taken).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update my username
      tags:
      - users
  /auth-svc/v1/me/media:
    delete:
      description: |
        Deletes a previously uploaded (not yet attached) media for the user's avatar.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUploadUserAvatar"
        required: true
      responses:
        "200":
          description: Media successfully deleted.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. Missing or invalid authorization token, or the authenticated user does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error.
      security:
      - BearerAuth: []
      summary: Delete uploaded user media
      tags:
      - users
    post:
      description: |
        Creates upload media links for the authenticated user's avatar.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUserMediaLinks"
          description: Upload media links successfully created.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. Missing or invalid authorization token, or the authenticated user does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error.
      security:
      - BearerAuth: []
      summary: Create user avatar upload media link
      tags:
      - users
  /auth-svc/v1/me/sessions:
    delete:
      description: |
        Deletes all sessions of the authenticated user (logout from all devices).
      responses:
        "204":
          description: Sessions successfully deleted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated user.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete my sessions
      tags:
      - sessions
    get:
      description: |
        Returns sessions of the authenticated user.
        Supports pagination, filtering by deletion status, and sorting by last used date.
      parameters:
      - description: Max number of items to return
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          minimum: 1
          type: integer
        style: form
      - description: Number of items to skip
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: |
          Filter sessions by active status. - `true` — only active (non-deleted) sessions - `false` — only deleted sessions - omit — all sessions (default)
        explode: true
        in: query
        name: "filter[active]"
        required: false
        schema:
          type: boolean
        style: form
      - description: |
          Sort sessions by last used date. - `desc` — most recently used first (default) - `asc` — least recently used first
        explode: true
        in: query
        name: "sort[last_used]"
        required: false
        schema:
          default: desc
          enum:
          - desc
          - asc
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionsCollection"
          description: Sessions successfully retrieved
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get my sessions
      tags:
      - sessions
  /auth-svc/v1/me/sessions/{session_id}:
    delete:
      description: |
        Deletes a session by ID. The session must belong to the authenticated user.
      parameters:
      - description: Session ID
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Session successfully deleted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. The session does not belong to the authenticated user.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Session not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete my session
      tags:
      - sessions
    get:
      description: |
        Returns a single session of the authenticated user by ID.
      parameters:
      - description: Session ID
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
          description: Session successfully retrieved
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Session not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get my session
      tags:
      - sessions
    parameters:
    - description: Session ID
      explode: false
      in: path
      name: session_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  /auth-svc/v1/login/qr:
    get:
      description: |
        Opens a Server-Sent Events (text/event-stream) connection. Upon connecting, the server generates a QR token and sends it as the first event. The client renders it as a QR code. When the mobile client confirms the token via POST /auth-svc/v1/login/qr/confirm, the server pushes the session tokens through this same stream and closes it. The stream closes with an `error` event if the token isn't confirmed within 5 minutes.

        Events sent as SSE `event:`/`data:` frames, each shaped like a normal JSON:API response body for this API:
          - `qr_token` — body shaped like the `QRToken` schema. Sent once, immediately
            after connecting.
          - `tokens` — body shaped like the `TokensPair` schema, same as every other
            login endpoint. Sent once the QR token is confirmed; the stream closes
            right after.
          - `error` — body shaped like the `Errors` schema. Sent if the token isn't
            confirmed in time; the stream closes right after.
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: |
            Event stream established. See the description above for the events sent over it.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      summary: Connect to QR login session
      tags:
      - qr
  /auth-svc/v1/login/qr/confirm:
    post:
      description: |
        Confirms a pending QR token. The mobile client (already authenticated) scans the QR code and calls this endpoint. The server creates a new session and pushes the tokens to the desktop's SSE stream opened via GET /auth-svc/v1/login/qr.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QRConfirm"
        required: true
      responses:
        "204":
          description: QR token confirmed. Tokens are delivered to the desktop via
            the SSE stream.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Request body is invalid or qr_token format is wrong. Check the `errors` array for details.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. Bearer token is missing or invalid.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            QR token not found or expired (TTL 5 minutes).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            QR token already confirmed.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Confirm QR token
      tags:
      - qr
  /auth-svc/v1/users/:
    get:
      description: |
        Returns a paginated list of public users filtered by optional query parameters. Supports prefix-based filtering for `username` and `pseudonym`.
      parameters:
      - description: |
          Text to filter users by. Matches against `username` and `pseudonym` fields.
        explode: true
        in: query
        name: text
        required: false
        schema:
          type: string
        style: form
      - description: Page number (1-based).
        explode: true
        in: query
        name: page
        required: false
        schema:
          minimum: 1
          type: integer
        style: form
      - description: Max number of items per page (1-100).
        explode: true
        in: query
        name: size
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersCollection"
          description: Users list.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal server error.
      summary: Filter users
      tags:
      - users
  /auth-svc/v1/users/@{username}:
    get:
      description: |
        Returns a public user by `username`. If the user does not exist, responds with 404.
      parameters:
      - description: Username of the user.
        explode: false
        in: path
        name: username
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User found.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: User does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal server error.
      summary: Get user by username
      tags:
      - users
  /auth-svc/v1/users/{user_id}:
    get:
      description: |
        Returns a public user by `user_id` (UUID). If the user does not exist, responds with 404.
      parameters:
      - description: User id (UUID).
        explode: false
        in: path
        name: user_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User found.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Bad request (invalid user_id).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: User does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal server error.
      summary: Get user by id
      tags:
      - users
components:
  schemas:
    LoginByEmail:
      example:
        data:
          type: user_session
          attributes:
            email: example@gmail.com
            password: StrongP@ssw0rd!
      properties:
        data:
          $ref: "#/components/schemas/LoginByEmail_data"
      required:
      - data
    Registration:
      example:
        data:
          type: user
          attributes:
            email: example@gmail.com
            password: StrongP@ssw0rd!
      properties:
        data:
          $ref: "#/components/schemas/Registration_data"
      required:
      - data
    RegistrationAdmin:
      example:
        data:
          type: user
          attributes:
            email: example1312@gmail.com
            password: StrongP@ssw0rd!
            role: admin
      properties:
        data:
          $ref: "#/components/schemas/RegistrationAdmin_data"
      required:
      - data
    RefreshSession:
      example:
        data:
          type: user_session
          attributes:
            refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      properties:
        data:
          $ref: "#/components/schemas/RefreshSession_data"
      required:
      - data
    UpdatePassword:
      example:
        data:
          type: user_password
          attributes:
            old_password: OldP@ssw0rd!
            new_password: StrongP@ssw0rd!
      properties:
        data:
          $ref: "#/components/schemas/UpdatePassword_data"
      required:
      - data
    UpdateUser:
      example:
        data:
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          type: user
          attributes:
            pseudonym: pseudonym
            description: description
            avatar_key: avatar_key
      properties:
        data:
          $ref: "#/components/schemas/UpdateUser_data"
      required:
      - data
    UpdateUsername:
