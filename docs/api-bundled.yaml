openapi: 3.1.1
info:
  title: netbill auth-svc API
  description: API documentation for auth-svc
  version: 0.1.0
servers:
  - url: 'http://localhost:8001'
paths:
  /auth-svc/v1/registration/:
    post:
      tags:
        - registration
      summary: Register a new account
      description: Endpoint to register a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Account successfully registered
        '409':
          description: |
            Conflict: An account with this email or phone number already exists. Check the 'detail' field in the response for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/registration/admin:
    post:
      tags:
        - registration
      summary: Register a new admin account
      description: |
        Registers a new account by an authenticated admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationAdmin'
      responses:
        '201':
          description: Account successfully registered by admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: |
            Bad Request. Request body is invalid or some attributes do not meet requirements. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Account cannot be resolved from context. Check the `detail` field in the response for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '409':
          description: |
            Conflict. Email or username is already taken. Check the `detail` field in the response for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/email:
    post:
      tags:
        - login
      summary: Login by email
      description: |
        Endpoint to login a user using their email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginByEmail'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensPair'
        '401':
          description: |
            Unauthorized: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/username:
    post:
      tags:
        - login
      summary: Login by username
      description: Endpoint to login a user using their username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginByUsername'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensPair'
        '401':
          description: |
            Unauthorized: Invalid username or password. Check the 'detail' field in the response for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/google:
    post:
      tags:
        - login
      summary: Start Google OAuth login
      description: |
        Redirects the user-agent to Google OAuth consent screen. This endpoint returns a redirect and does not return a JSON:API document.
      responses:
        '307':
          description: Temporary Redirect to Google OAuth consent screen
          headers:
            Location:
              description: Google OAuth authorization URL
              schema:
                type: string
                format: uri
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/login/google/callback:
    get:
      tags:
        - login
      summary: Google OAuth callback
      description: |
        Exchanges Google OAuth `code` for user info and returns an access/refresh tokens pair.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: OAuth authorization code returned by Google
      responses:
        '200':
          description: Tokens pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensPair'
        '400':
          description: Missing or invalid query parameter `code`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Account not found or deleted for this email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/refresh:
    post:
      tags:
        - sessions
      summary: Refresh session
      description: |
        Issues a new access/refresh tokens pair using a valid refresh token.
        **401 Unauthorized** is returned when the account or session does not exist. **403 Forbidden** is returned when the account is inactive or the refresh token does not match the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSession'
      responses:
        '200':
          description: Tokens pair successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensPair'
        '400':
          description: |
            Bad Request. Request body is invalid. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Account not found or session not found or invalid refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me:
    get:
      tags:
        - accounts
      summary: Get my account
      description: |
        Returns the authenticated account.
      parameters:
        - in: query
          name: include
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - email
          style: form
          explode: false
          description: |
            Optional related resources to include. Supported values: `email`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: |
            Unauthorized. The account is deleted and can no longer be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - accounts
      summary: Delete my account
      description: |
        Deletes the authenticated account.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account successfully deleted
        '401':
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/logout:
    post:
      tags:
        - sessions
      summary: Logout
      description: |
        Invalidates the current session of the authenticated account. This operation is idempotent — if the session is already deleted, 204 is returned.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Successfully logged out (or session was already deleted)
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/password:
    patch:
      tags:
        - accounts
      summary: Update password
      description: |
        Updates the password of the authenticated account.
        **401 Unauthorized** is returned when the session is invalid or the old password is incorrect.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePassword'
      responses:
        '204':
          description: Password successfully updated
        '400':
          description: |
            Bad Request. Request body is invalid or the new password does not meet requirements. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. The session is invalid, does not belong to the authenticated account, or the old password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/username:
    patch:
      tags:
        - accounts
      summary: Update username
      description: |
        Updates the username of the authenticated account.
        **401 Unauthorized** is returned when the account is deleted. **404 Not Found** is returned when the account does not exist. **409 Conflict** is returned when the requested username is already taken.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsername'
      responses:
        '200':
          description: Username successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: |
            Bad Request. Request body is invalid. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. The account is deleted and can no longer be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '409':
          description: |
            Conflict. The requested username is already taken. Check the `detail` field in the response for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /auth-svc/v1/me/sessions:
    get:
      tags:
        - sessions
      summary: Get my sessions
      description: |
        Returns sessions of the authenticated account.
        Supports pagination, filtering by deletion status, and sorting by last used date.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: 'page[limit]'
          required: false
          schema:
            type: integer
            minimum: 1
          description: Max number of items to return
        - in: query
          name: 'page[offset]'
          required: false
          schema:
            type: integer
            minimum: 0
          description: Number of items to skip
        - in: query
          name: 'filter[active]'
          required: false
          schema:
            type: boolean
          description: |
            Filter sessions by active status. - `true` — only active (non-deleted) sessions - `false` — only deleted sessions - omit — all sessions (default)
        - in: query
          name: 'sort[last_used]'
          required: false
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
          description: |
            Sort sessions by last used date. - `desc` — most recently used first (default) - `asc` — least recently used first
      responses:
        '200':
          description: Sessions successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessionsCollection'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - sessions
      summary: Delete my sessions
      description: |
        Deletes all sessions of the authenticated account (logout from all devices).
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Sessions successfully deleted
        '401':
          description: |
            Unauthorized. The session is invalid or does not belong to the authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/auth-svc/v1/me/sessions/{session_id}':
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
          format: uuid
        description: Session ID
    get:
      tags:
        - sessions
      summary: Get my session
      description: |
        Returns a single session of the authenticated account by ID.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - sessions
      summary: Delete my session
      description: |
        Deletes a session by ID. The session must belong to the authenticated account.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Session successfully deleted
        '401':
          description: |
            Unauthorized. The session does not belong to the authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginByEmail:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - account_session
            attributes:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: The account's email address.
                  example: example@gmail.com
                password:
                  type: string
                  format: password
                  description: The account's password.
                  example: StrongP@ssw0rd!
    LoginByUsername:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - account_session
            attributes:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: The account's username.
                  example: example
                password:
                  type: string
                  format: password
                  description: The account's password.
                  example: StrongP@ssw0rd!
    Registration:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - account
            attributes:
              type: object
              required:
                - email
                - username
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: The account's email address.
                  example: example@gmail.com
                username:
                  type: string
                  description: The account's username.
                  example: user123
                password:
                  type: string
                  format: password
                  description: The account's password.
                  example: StrongP@ssw0rd!
    RegistrationAdmin:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - account
            attributes:
              type: object
              required:
                - email
                - username
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  description: The account's email address.
                  example: example1312@gmail.com
                username:
                  type: string
                  description: The account's username.
                  example: adminUser
                password:
                  type: string
                  format: password
                  description: The account's password.
                  example: StrongP@ssw0rd!
                role:
                  type: string
                  description: The role assigned to the registering account.
                  enum:
                    - admin
                    - moderator
                  example: admin
    RefreshSession:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - account_session
            attributes:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: The refresh token to generate a new access token.
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    UpdatePassword:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - account_password
            attributes:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  format: password
                  description: The account's current password.
                  example: OldP@ssw0rd!
                new_password:
                  type: string
                  format: password
                  description: The account's password.
                  example: StrongP@ssw0rd!
    UpdateUsername:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - account_username
            attributes:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  description: The account's username.
    TokensPair:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
              format: uuid
              description: account id
            type:
              type: string
              enum:
                - tokens_pair
            attributes:
              type: object
              required:
                - access_token
                - refresh_token
              properties:
                access_token:
                  type: string
                  description: Access Token
                refresh_token:
                  type: string
                  description: Refresh Token
    AccessToken:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - access_token
            attributes:
              type: object
              required:
                - access_token
              properties:
                refresh_token:
                  type: string
                  description: The access token to generate a new access token.
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    AccountSession:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AccountSessionData'
    AccountSessionData:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
          description: session id
        type:
          type: string
          enum:
            - account_session
        attributes:
          $ref: '#/components/schemas/AccountSessionAttributes'
    AccountSessionAttributes:
      type: object
      required:
        - account_id
        - created_at
        - version
        - updated_at
        - last_used
      properties:
        account_id:
          type: string
          format: uuid
          description: account id
        created_at:
          type: string
          format: date-time
          description: session creation date
        version:
          type: integer
          description: The version number of the account record
        last_used:
          type: string
          format: date-time
          description: last used date
        updated_at:
          type: string
          format: date-time
          description: updated at date
        deleted_at:
          type: string
          format: date-time
          description: session deletion date
    AccountSessionsCollection:
      type: object
      required:
        - data
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountSessionData'
        links:
          $ref: '#/components/schemas/PaginationData'
    Account:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
              format: uuid
              description: account ID
            type:
              type: string
              enum:
                - account
            attributes:
              type: object
              required:
                - role
                - username
                - version
                - created_at
                - updated_at
              properties:
                role:
                  type: string
                  description: The role assigned to the account
                username:
                  type: string
                  description: The username of the account
                version:
                  type: integer
                  description: The version number of the account record
                created_at:
                  type: string
                  format: date-time
                  description: The date and time when the account was created
                updated_at:
                  type: string
                  format: date-time
                  description: The date and time when the account was last updated
        included:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/AccountEmail'
    AccountEmail:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
          description: account ID
        type:
          type: string
          enum:
            - account_email
        attributes:
          type: object
          required:
            - email
            - version
            - verified
            - updated_at
            - created_at
          properties:
            email:
              type: string
              format: email
              description: The email address associated with the account
            version:
              type: integer
              description: The version number of the account record
            verified:
              type: boolean
              description: Indicates whether the email address has been verified
            updated_at:
              type: string
              format: date-time
              description: The date and time when the email information was last updated
            created_at:
              type: string
              format: date-time
              description: The date and time when the email information was created
    Errors:
      description: 'Standard JSON:API error'
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          description: Non empty array of errors occurred during request processing
          items:
            type: object
            required:
              - title
              - status
            properties:
              title:
                type: string
                description: 'Title is a short, human-readable summary of the problem'
                example: Bad Request
              detail:
                type: string
                description: Detail is a human-readable explanation specific to this occurrence of the problem
                example: Request body was expected
              status:
                type: integer
                description: Status is the HTTP status code applicable to this problem
                example: 400
                enum:
                  - 400
                  - 401
                  - 403
                  - 404
                  - 409
                  - 500
    PaginationData:
      type: object
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          description: link to the current page
        first:
          type: string
          format: uri
          description: link to the first page
        last:
          type: string
          format: uri
          description: link to the last page
        prev:
          type: string
          format: uri
          description: link to the previous page
        next:
          type: string
          format: uri
          description: link to the next page
