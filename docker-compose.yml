services:
  auth-svc:
    build: .
    container_name: auth-svc
    ports:
      - "8001:8000"
    networks:
      - netbill-net

  auth-svc-postgres:
    image: postgres:15
    container_name: auth-svc-postgres
    command: postgres -c wal_level=logical
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "7001:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - netbill-net

  auth-svc-redis:
    image: redis:7-alpine
    container_name: auth-svc-redis
    ports:
      - "7002:6379"
    volumes:
      - redisdata:/data
    networks:
      - netbill-net

  auth-svc-swagger:
    image: swaggerapi/swagger-ui
    container_name: auth-svc-swagger
    environment:
      - SWAGGER_JSON=/docs/api-bundled.yaml
    volumes:
      - ./docs:/docs:ro
    ports:
      - "5001:8080"
    networks:
      - netbill-net

volumes:
  pgdata:
  redisdata:

networks:
  netbill-net:
    external: true
