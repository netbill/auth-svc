syntax = "proto3";

package auth.v1;

option go_package = "github.com/netbill/auth-svc/proto/pb;pb";

import "common.proto";
import "google/protobuf/empty.proto";

// UserService manages users: registration, profile, credentials.
//
// All methods except CreateUser require authentication via metadata:
//   authorization: Bearer <access_token>
service UserService {
  // CreateUser registers a new user.
  //
  // Errors:
  //   ALREADY_EXISTS      — email is already taken
  //   INVALID_ARGUMENT    — password does not meet requirements
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // GetMyUser returns the authenticated user's profile.
  //
  // Errors:
  //   NOT_FOUND           — user does not exist or was deleted
  rpc GetMyUser(GetMyUserRequest) returns (GetMyUserResponse);

  // GetMyEmail returns the authenticated user's primary email address.
  //
  // Errors:
  //   NOT_FOUND           — user does not exist
  rpc GetMyEmail(GetMyEmailRequest) returns (GetMyEmailResponse);

  // UpdatePassword changes the password of the authenticated user.
  // The old password must be provided for verification.
  //
  // Errors:
  //   UNAUTHENTICATED     — old password is incorrect or session is invalid
  //   INVALID_ARGUMENT    — new password does not meet requirements
  //   FAILED_PRECONDITION — password was changed too recently
  rpc UpdatePassword(UpdatePasswordRequest) returns (google.protobuf.Empty);

  // DeleteMyUser soft-deletes the authenticated user along with all its
  // sessions and email addresses. The operation is irreversible via the API.
  //
  // Errors:
  //   UNAUTHENTICATED     — session is invalid or expired
  rpc DeleteMyUser(DeleteMyUserRequest) returns (google.protobuf.Empty);
}

message CreateUserRequest {
  // Valid email address. Must be unique across all users.
  string email = 1;

  // Password. 8–32 characters, must contain at least one uppercase letter,
  // one lowercase letter, one digit and one special character (-.!#$%&?,@).
  string password = 3;
}

message CreateUserResponse {
  User user = 1;
}

message GetMyUserRequest {}

message GetMyUserResponse {
  User user = 1;
}

message GetMyEmailRequest {}

message GetMyEmailResponse {
  UserEmail email = 1;
}

message UpdatePasswordRequest {
  // Current password for verification.
  string old_password = 1;

  // New password. Same rules as CreateUserRequest.password.
  string new_password = 2;
}

message DeleteMyUserRequest {}
